<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>地形制图台 · Terrain Atelier</title>
<link rel="stylesheet" href="./vendor/leaflet/leaflet.css" />
<link rel="stylesheet" href="./src/app.css" />
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/addons/"
  }
}
</script>
</head>
<body>

<div id="stage"></div>
<div id="grain"></div>
<div class="labels s-song" id="labels"></div>

<!-- ─────────── 顶栏 ─────────── -->
<header class="topbar">
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2.5 18.5 9 7l3.6 6.2L15.2 9l6.3 9.5z"/>
      <path d="M2.5 20.5h19"/>
    </svg>
    <div class="brand-txt"><b>地形制图台</b><i>TERRAIN · ATELIER</i></div>
  </div>

  <div class="region-wrap">
    <button class="region-btn" id="regionBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.4"/></svg>
      <span id="regionName">浙江省</span>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <div class="region-menu" id="regionMenu">
      <div class="rm-head">
        <span>选择展示区域</span>
        <span class="rm-note">点选任意一级 → 点「确定切换」</span>
      </div>
      <div class="rm-cols">
        <div class="rm-col">
          <div class="rm-col-hd"><span>省份</span><i id="rmN1">—</i></div>
          <div class="rm-list" id="rmProv"><div class="rm-empty">读取中…</div></div>
        </div>
        <div class="rm-col">
          <div class="rm-col-hd"><span>城市</span><i id="rmN2">—</i></div>
          <div class="rm-list" id="rmCity"><div class="rm-empty">先选省份</div></div>
        </div>
        <div class="rm-col">
          <div class="rm-col-hd"><span>区县</span><i id="rmN3">—</i></div>
          <div class="rm-list" id="rmCnty"><div class="rm-empty">先选城市</div></div>
        </div>
      </div>
      <div class="rm-confirm">
        <span class="rm-sel" id="rmSel"><i>尚未选择</i></span>
        <button class="rm-ok" id="rmOk" disabled>确定切换</button>
      </div>
      <div class="rm-foot">
        <button class="ghost-btn" id="btnUpload">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 16V4m0 0 4 4m-4-4L8 8"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
          上传矢量边界
        </button>
        <input type="file" id="fileInput" accept=".json,.geojson" hidden />
        <input type="file" id="waterInput" accept=".json,.geojson" hidden />
        <div class="rm-tip">GeoJSON · WGS84/GCJ-02 · 面积极限 220 万 km²</div>
      </div>
    </div>
  </div>

  <nav class="style-tabs" id="styleTabs"></nav>

  <div class="topbar-right">
    <button class="icon-btn on" id="btnLabels" title="显示 / 隐藏名称标注">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 18 8.6 6l4.6 12"/><path d="M5.7 14.2h5.8"/><path d="M16 18V9.4h2.6a2.3 2.3 0 0 1 0 4.6H16"/></svg>
    </button>
    <button class="icon-btn" id="btnCoffee" title="样式说明">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><circle cx="12" cy="8" r="0.9" fill="currentColor" stroke="none"/></svg>
    </button>
    <button class="icon-btn" id="btnHideUI" title="隐藏全部界面（H）">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2.5 12S6 5.8 12 5.8 21.5 12 21.5 12 18 18.2 12 18.2 2.5 12 2.5 12z"/><path d="m4 20 16-16"/></svg>
    </button>
    <button class="icon-btn" id="btnPanel" title="收起面板">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg>
    </button>
  </div>
</header>

<!-- ─────────── 右侧参数面板 ─────────── -->
<aside class="panel" id="panel"></aside>

<!-- ─────────── 小地图 ─────────── -->
<aside class="minimap-panel" id="mmPanel">
  <div class="mm-head">
    <span>视图范围</span>
    <span class="mm-badge" id="mmBadge">—</span>
  </div>
  <div id="minimap"></div>
  <div class="mm-foot">点击地图移动视点</div>
</aside>

<!-- ─────────── 左下操作条 ─────────── -->
<div class="dock">
  <label class="dock-field">
    <span>视角</span>
    <select id="viewPreset">
      <option value="iso">等轴测</option>
      <option value="low">低角度</option>
      <option value="top">正俯视</option>
      <option value="south">南向平视</option>
    </select>
  </label>
  <button class="dock-btn" id="btnReset">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
    复位
  </button>
  <button class="dock-btn" id="btnFull">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 9V4h5M20 15v5h-5M20 9V4h-5M4 15v5h5"/></svg>
    全屏
  </button>
</div>

<div class="hint" id="hint">拖拽旋转 · 滚轮缩放 · 右键平移 · 双击聚焦</div>

<!-- 指北针：随相机方位角旋转，点击回到正北 -->
<button class="compass" id="compass" title="点击回到正北 (N)">
  <svg viewBox="0 0 64 64" aria-hidden="true">
    <circle cx="32" cy="32" r="27" fill="none" stroke="currentColor" stroke-opacity=".22" stroke-width="1"/>
    <circle cx="32" cy="32" r="21" fill="none" stroke="currentColor" stroke-opacity=".12" stroke-width=".8"/>
    <path d="M32 2.5 35 8.2 29 8.2z" fill="currentColor" fill-opacity=".55"/>
    <g id="compassRose">
      <path d="M32 12.5 37.4 32 32 29.2 26.6 32z" fill="var(--accent)"/>
      <path d="M32 51.5 26.6 32 32 34.8 37.4 32z" fill="currentColor" fill-opacity=".30"/>
      <g fill="currentColor" font-family="var(--mono)" font-size="7.4" text-anchor="middle">
        <text x="32" y="11.4">N</text>
        <text x="53.5" y="34.8">E</text>
        <text x="32" y="60.2">S</text>
        <text x="10.5" y="34.8">W</text>
      </g>
    </g>
  </svg>
</button>

<!-- 图层快捷开关（左侧竖排，解决「找不到开关」） -->
<div class="lay-rail" id="layRail"></div>

<!-- 隐藏界面后的恢复入口 -->
<button class="ui-restore" id="uiRestore" title="显示界面 (H)">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2.5 12S6 5.8 12 5.8 21.5 12 21.5 12 18 18.2 12 18.2 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.6"/></svg>
</button>

<footer class="statusbar">
  <span class="sb-item" id="sbLonLat">—</span>
  <span class="sb-sep"></span>
  <span class="sb-item" id="sbElev">—</span>
  <span class="sb-sep"></span>
  <span class="sb-item" id="sbRange">—</span>
  <span class="sb-sep"></span>
  <span class="sb-item sb-fps" id="fps">—</span>
  <span class="sb-grow"></span>
  <span class="sb-item sb-dim">数据：阿里云 DataV 行政区划 · Terrarium 90m DEM（SRTM/NED/ASTER）</span>
  <span class="sb-item sb-dim">背景遥感：高德影像离线烘焙 · 小地图 © 高德地图 · Leaflet</span>
</footer>

<!-- ─────────── 载入遮罩 ─────────── -->
<div class="loader" id="loader">
  <div class="loader-box">
    <div class="loader-title">正在构建地形</div>
    <div class="loader-stage" id="loaderStage">准备数据…</div>
    <div class="loader-track"><i id="loaderBar"></i></div>
    <div class="loader-meta" id="loaderMeta"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="./vendor/leaflet/leaflet.js"></script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
